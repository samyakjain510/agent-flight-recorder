[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flightrec"
version = "0.1.0"
description = "A local flight recorder for multi-agent Claude Code runs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Samyak Jain" }]
dependencies = []

[project.scripts]
flightrec = "flightrec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
